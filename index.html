<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Keuangan Keluarga</title>
<meta name="description" content="Catat pemasukan, pengeluaran, dan tabungan keluarga. Data tersimpan di Google Sheets milik Anda sendiri.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Keuangan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#FFFFFF; --bg2:#FFFFFF; --top:#FFFFFF; --surface:#FFFFFF; --track:#EEF2F8; --line:#E3E9F3; --line2:#EEF2F8; --line3:#7F92B3;
  --ink:#14233F; --ink2:#566684;
  --brand:#1F5FE0; --on-brand:#FFFFFF; --brand-tint:#EAF1FF; --brand-ink:#16459C; --blue2:#D5E3FF;
  --in:#0A7A4F; --out:#B03E0C; --save:#1F5FE0;
  --hero:#FFFFFF; --hero2:#FFFFFF; --on-hero:#14233F;
  --warn-bg:#FFF3D6; --warn-ink:#7A5200; --bad-bg:#FDE8E6; --bad-ink:#A4231A;
  --scrim:rgba(10,18,40,.45); --shadow:0 4px 16px rgba(30,60,130,.07);
  /* warna kategori: f = isi makhluk, t = latar pucat */
  --terra-t:#FFEAE4;  --terra-f:#E8562E;
  --orange-t:#FFEFDB; --orange-f:#F08A1C;
  --amber-t:#FBF1D3;  --amber-f:#D9A21B;
  --pink-t:#FFE8F3;   --pink-f:#DC62A6;
  --rose-t:#FFE6EE;   --rose-f:#DB4A7C;
  --purple-t:#F3E9FA; --purple-f:#A867D0;
  --blue-t:#E8EDFB;   --blue-f:#5A78D4;
  --sky-t:#E0F1FA;    --sky-f:#2B8DBE;
  --teal-t:#DDF4F5;   --teal-f:#3FAFB8;
  --green-t:#E4F3E4;  --green-f:#4F9E55;
  --gray-t:#EDF0F5;   --gray-f:#7C879B;
  --ink-t:#E9ECF2;    --ink-f:#3A4256;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(8px + env(safe-area-inset-top,0px)) 156px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit}
#view:focus{outline:none}
button{cursor:pointer;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0}
h1{font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
h2{font-size:14px;font-weight:700}
.app{max-width:480px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--ink2)}
.sm{font-size:12px}
.xs{font-size:11px}
.b{font-weight:700}
.bb{font-weight:800}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{display:flex;align-items:center;gap:8px;padding:8px 0 4px;min-height:60px;margin-bottom:8px}
.top .grow{flex:1;min-width:0}
.top h1{overflow-wrap:anywhere}
.top .sub{font-size:12px;color:var(--ink2);margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;font-size:11px;font-weight:700;white-space:nowrap;flex:none}
.chip.ok{background:var(--brand-tint);color:var(--brand-ink)}
.chip.wait{background:var(--warn-bg);color:var(--warn-ink)}
.chip.off{background:var(--track);color:var(--ink2)}
.chip.bad{background:var(--bad-bg);color:var(--bad-ink)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700;background:var(--warn-bg);color:var(--warn-ink);white-space:nowrap}
.tag.plain{background:var(--track);color:var(--ink2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.card.big{border-radius:22px;padding:18px}
.hero{background:radial-gradient(130px 100px at 100% 0,var(--brand-tint),transparent 72%),var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);position:relative}
.hero .div{display:flex;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.hero .div>div{flex:1;min-width:0}
.hero .big-num{color:var(--brand)}
.hero a,.hero button{color:inherit}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--f,var(--brand))}
.stats{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.stats>div{flex:1;min-width:0}
.big-num{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.link{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 6px;font-size:12px;font-weight:700;color:var(--brand);text-decoration:none;background:none;border:0}
.hero .link{color:var(--brand)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}

.c-terra{--t:var(--terra-t);--f:var(--terra-f)}
.c-orange{--t:var(--orange-t);--f:var(--orange-f)}
.c-amber{--t:var(--amber-t);--f:var(--amber-f)}
.c-pink{--t:var(--pink-t);--f:var(--pink-f)}
.c-rose{--t:var(--rose-t);--f:var(--rose-f)}
.c-purple{--t:var(--purple-t);--f:var(--purple-f)}
.c-blue{--t:var(--blue-t);--f:var(--blue-f)}
.c-sky{--t:var(--sky-t);--f:var(--sky-f)}
.c-teal{--t:var(--teal-t);--f:var(--teal-f)}
.c-green{--t:var(--green-t);--f:var(--green-f)}
.c-gray{--t:var(--gray-t);--f:var(--gray-f)}
.c-ink{--t:var(--ink-t);--f:var(--ink-f)}
.tile{width:46px;height:46px;flex:none;border-radius:16px;display:grid;place-items:center;background:var(--t);color:var(--f)}
.tile svg{width:30px;height:30px}
.tile.s{width:42px;height:42px;border-radius:15px}
.tile.s svg{width:28px;height:28px}
.tile.xl{width:72px;height:72px;border-radius:24px}
.tile.xl svg{width:50px;height:50px}
@media (prefers-reduced-motion:no-preference){.row:active .tile,.mod:active .mi,.card:active .tile{transform:scale(.9) rotate(-4deg)}.tile,.mi{transition:transform .15s ease-out}}

.list{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;border:0;border-top:1px solid var(--line2);background:none;width:100%;text-align:left;text-decoration:none;color:inherit}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t1{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.row .t2{font-size:12px;color:var(--ink2);margin-top:1px;overflow-wrap:anywhere}
.row .amt{flex:none;font-size:13px;font-weight:800;text-align:right}
.dayh{display:flex;justify-content:space-between;margin:6px 4px 6px;font-size:12px;font-weight:700;color:var(--ink2)}
.empty{padding:28px 16px;text-align:center;color:var(--ink2);font-size:13px}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}

.seg{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--track)}
.seg button{flex:1;min-height:44px;border:0;border-radius:12px;background:transparent;color:var(--ink2);font-size:13px;font-weight:700}
.seg button[aria-checked="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.monthbar{display:flex;align-items:center;justify-content:space-between}
.monthbar .m{font-size:16px;font-weight:700}
.sq,.ibtn{width:44px;height:44px;flex:none;border-radius:22px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);box-shadow:var(--shadow);padding:0}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.pill{min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--line3);background:var(--surface);color:var(--ink);font-size:13px;font-weight:700;white-space:nowrap}
.pill[aria-checked="true"],.pill[aria-pressed="true"]{background:var(--brand-tint);border-color:var(--brand);color:var(--brand-ink)}
.pill.dash{border-style:dashed;color:var(--brand);background:transparent}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 20px;border-radius:26px;border:0;background:var(--brand);color:var(--on-brand);font-size:15px;font-weight:800;text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--brand);border:1.5px solid var(--brand)}
.btn.quiet{background:none;color:var(--ink2);min-height:44px;font-size:14px;font-weight:700}
.btn.warn{background:var(--bad-bg);color:var(--bad-ink)}
.btns{display:flex;gap:10px}
.btns .btn{flex:1}

.field label,.field .lbl{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.inp{width:100%;height:48px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line3);background:var(--surface);color:var(--ink);font-size:15px;font-weight:600}
.inp:focus{border-color:var(--brand);outline:none}
.money{display:flex;align-items:center;gap:8px;height:56px;padding:0 16px;border-radius:16px;border:1.5px solid var(--line3);background:var(--surface)}
.money:focus-within{border-color:var(--brand)}
.money span{font-size:16px;font-weight:700;color:var(--ink2)}
.money input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-size:26px;font-weight:800;padding:0;outline:none}
.hint{font-size:12px;color:var(--ink2);margin-top:6px}
.err{background:var(--bad-bg);color:var(--bad-ink);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.icons{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.icons button{height:56px;border-radius:18px;border:2px solid var(--line);background:var(--t);color:var(--f);display:grid;place-items:center;padding:0}
.icons button[aria-checked="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-tint)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:44px;height:44px;border-radius:22px;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line3);background:var(--f);display:grid;place-items:center;color:#fff;padding:0}
.sw button[aria-checked="true"]{box-shadow:0 0 0 3px var(--ink)}
.pvw{display:flex;align-items:center;gap:14px;padding:12px;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.pvw .grow{flex:1;min-width:0}
.seg button:disabled{opacity:.5}
.two{display:flex;gap:12px}
.two>*{flex:1;min-width:0}

.alert{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.alert .st{flex:none;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700}
.st.bad{background:var(--bad-bg);color:var(--bad-ink)}
.st.warn{background:var(--warn-bg);color:var(--warn-ink)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--brand-tint);color:var(--brand-ink);font-size:13px}
.note.warn{background:var(--warn-bg);color:var(--warn-ink)}
.note.blue{background:var(--blue-t);color:var(--blue-f)}
.note svg{flex:none;margin-top:1px}
.note .t{font-weight:700}

.chartwrap{position:relative;height:100px;margin-top:14px}
.grid-l{position:absolute;left:34px;right:0;height:0;border-top:1px dashed var(--line)}
.grid-t{position:absolute;left:0;font-size:11px;line-height:12px;color:var(--ink2)}
.bars{position:absolute;left:34px;right:0;top:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-around;border-bottom:1px solid var(--line3)}
.bars .g{display:flex;align-items:flex-end;gap:4px;height:100%}
.bars i{display:block;width:clamp(10px,4.5vw,18px);border-radius:4px 4px 0 0}
.bars i.in{background:var(--in)}
.bars i.out{background:var(--out)}
.mlabels{display:flex;justify-content:space-around;margin:8px 0 0 34px;font-size:11px;font-weight:600;color:var(--ink2)}
.mlabels span{width:40px;text-align:center}
.mlabels span.now,.cur{color:var(--brand);font-weight:800}
.legend{display:flex;gap:10px;font-size:11px;font-weight:600;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}
.tbl{display:grid;grid-template-columns:44px 1fr 1fr 1fr;column-gap:6px;align-items:center;padding:0 8px;min-height:36px;border-radius:10px;font-size:13px}
.tbl.h{min-height:24px;font-size:11px;font-weight:700;color:var(--ink2)}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl.now{background:var(--brand-tint)}
.stack-bar{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden}
.stack-bar i{display:block;background:var(--f)}
.dot{width:10px;height:10px;border-radius:3px;background:var(--f);flex:none}
.legrow{display:flex;align-items:center;gap:10px;min-height:32px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;padding:0 max(12px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-right,0px))}
.tabs .in{pointer-events:auto;max-width:456px;margin:0 auto;display:flex;align-items:center;gap:2px;padding:6px;border-radius:30px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 28px rgba(20,40,100,.14)}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:58px;padding:5px 2px;border-radius:24px;text-decoration:none;font-size:11px;font-weight:700;color:var(--ink2);background:none;border:0}
.tab svg{width:28px;height:28px;color:var(--f)}
.tab[aria-current="page"]{background:var(--t);color:var(--ink)}
.fab{pointer-events:auto;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:28px;border:0;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;box-shadow:0 8px 20px rgba(31,95,224,.38)}

#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
#sheet .scrim{position:absolute;inset:0;background:var(--scrim)}
#sheet .panel{position:relative;width:100%;max-width:480px;max-height:94%;background:var(--bg);border-radius:24px 24px 0 0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet .ph{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 2px 20px;min-height:56px}
#sheet .ph h2{font-size:18px;font-weight:800}
#sheet .pb{overflow-y:auto;padding:8px 20px 22px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.ib{width:44px;height:44px;border-radius:22px;border:0;background:none;display:grid;place-items:center;color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(158px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:min(92vw,440px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:13px;font-weight:600;text-align:center}
#toast[hidden]{display:none}
.lock{overflow:hidden}
details.help{background:var(--surface);border:1px solid var(--line);border-radius:18px}
details.help summary{min-height:48px;padding:0 16px;display:flex;align-items:center;font-weight:700;font-size:14px;cursor:pointer}
details.help .in{padding:0 16px 14px;font-size:13px;color:var(--ink2);display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:no-preference){#sheet .panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

/* ---- Beranda baru, modul, kalender ---- */
.fhead{display:flex;align-items:center;gap:8px;padding:6px 0 2px;min-height:64px}
.fhead .grow{flex:1;min-width:0}
.fhead h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fhead .sub{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdot{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--in);flex:none}
.sdot.wait{background:#E0A100}.sdot.bad{background:var(--out)}.sdot.off{background:var(--line3)}
@media (prefers-reduced-motion:no-preference){.spin svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}
.salat{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:16px;box-shadow:var(--shadow)}
.salat .loc{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink2)}
.salat .nx{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.salat .nx b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.pbtn{flex:none;height:44px;padding:0 16px;border-radius:22px;border:0;background:var(--brand-tint);color:var(--brand-ink);font-weight:800;font-size:13px}
.p5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.p5 div{border-radius:16px;background:var(--track);padding:8px 2px;text-align:center;font-size:12px;font-weight:600;color:var(--ink2);min-width:0}
.p5 div b{display:block;font-size:15px;font-weight:800;color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums}
.p5 div.on{background:var(--brand-tint);color:var(--brand-ink);box-shadow:inset 0 0 0 1.5px var(--brand)}
.p5 div.on b{color:var(--brand-ink)}
.mods{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mod{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 10px;min-height:106px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);font-size:12px;font-weight:700;text-align:center;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.mod .mi{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;background:var(--t);color:var(--f);flex:none}
.mod .mi svg{width:38px;height:38px}
.sum2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum2>*{min-width:0}
.dn{position:relative;width:96px;height:96px;margin:6px auto 2px}
.dn .c{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:800}
.bluec{background:radial-gradient(90px 80px at 100% 0,var(--brand-tint),transparent 75%),var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0}
.bluec .t,.bluec .s{color:var(--ink2)}
.bluec .v{color:var(--brand)}
.bluec .t{font-size:13px;font-weight:700}
.bluec .v{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.2;overflow-wrap:anywhere}
.bluec .s{font-size:12px;font-weight:600}
.mrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;min-height:30px}
.mrow .ml{font-size:12px;font-weight:700;color:var(--ink2)}
.mrow .mv{font-size:12px;font-weight:800;text-align:right;min-width:78px}
.mrow.now .ml{color:var(--brand);font-weight:800}
.ptop{display:flex;align-items:center;gap:10px;min-height:34px}
.ptop .pn{flex:1;min-width:0;font-size:13px;font-weight:700;overflow-wrap:anywhere}
.ptop .pv{font-size:12px;font-weight:700;color:var(--ink2);flex:none}

function eye(x,y,k,dx,dy){
  k=k||1;dx=(dx||0)*k;dy=(dy||0)*k;
  return '<ellipse cx="'+f1(x)+'" cy="'+f1(y)+'" rx="'+f1(2.5*k)+'" ry="'+f1(3.2*k)+'" fill="'+EYE_W+'" stroke="none"/>'

function agOcc(a,from,to){

  if(!a.ulang){if(d0>=from&&d0<=to)out.push(d0);return out;}

    var n0=dayNum(d0),nf=dayNum(from),nt=dayNum(to),n=n0>=nf?n0:n0+Math.ceil((nf-n0)/7)*7;

  }

  if(a.ulang==='bulanan'){
    y=f.getFullYear();m=f.getMonth();
    while(y<t.getFullYear()||(y===t.getFullYear()&&m<=t.getMonth())){
      dim=new Date(y,m+1,0).getDate();key=mk(y,m)+'-'+pad(Math.min(s.getDate(),dim));
      if(key>=d0&&key>=from&&key<=to)out.push(key);

  }

      dim=new Date(y,s.getMonth()+1,0).getDate();key=y+'-'+pad(s.getMonth()+1)+'-'+pad(Math.min(s.getDate(),dim));

var HAS_GEO=true,HAS_GCAL=true;
/* S.cfg: {u:alamat Web app, k:kunci} atau, bila Web app memakai Masuk dengan Google, {u, m:'masuk', c:clientId, s:sesi, e:email, n:nama} */
S.cfg=ls.get('kk_cfg');if(!S.cfg||typeof S.cfg.u!=='string'||(S.cfg.m!=='masuk'&&typeof S.cfg.k!=='string'))S.cfg=null;
S.rev=0;S.sheetUrl=S.sheetUrl||'';S.sync={err:'',msg:'',at:0};S.authBad=false;S.install=null;S.pend=null;S.srvVer=0;S.gateBusy=false;S.gcalBusy=false;S.infoBusy=false;S.infoFail=false;
var NEWC={belanja:1,agenda:1,umroh:1};
function remote(){return !!S.cfg;}
function needLogin(){return !!(S.cfg&&S.cfg.m==='masuk'&&!S.cfg.s);}
function bkLocked(){return needLogin();}
function canSync(){return !!S.cfg&&!S.authBad&&!needLogin();}
function bkNeedUpdate(){return !!S.cfg&&S.srvVer===1;}
function bkNeedV3(){return !!S.cfg&&S.srvVer>0&&S.srvVer<3;}
function urlOk(u){return typeof u==='string'&&u.indexOf('https://script.google.com/')===0&&/\/exec$/.test(u)&&u.length<400;}
function apiCall(cfg,action,payload){
  var ctl=typeof AbortController!=='undefined'?new AbortController():null;
  var to=setTimeout(function(){if(ctl)ctl.abort();},25000);
  var body={a:action};
  if(cfg.m==='masuk'){if(cfg.s)body.s=cfg.s;}else if(cfg.k)body.k=cfg.k;
  if(action==='tarik'&&payload&&payload.rev)body.rev=payload.rev;
  if(action==='dorong')body.ops=payload.ops;
  if(action==='masuk')body.idt=payload.idt;
  return fetch(cfg.u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:ctl?ctl.signal:undefined,credentials:'omit'})
    .then(function(r){clearTimeout(to);if(!r.ok)throw {code:'http',status:r.status};return r.text();},function(){clearTimeout(to);throw {code:'jaringan'};})
    .then(function(t){var j;try{j=JSON.parse(t);}catch(e){throw {code:'respon'};}
      if(!j||j.ok!==true)throw {code:(j&&j.error)||'respon',msg:j&&j.msg,email:j&&j.email};
      return j;})
    .catch(function(e){throw (e&&e.code)?e:{code:'jaringan'};});
}
function errText(e){
  var c=e&&e.code;
  if(c==='kunci')return 'Kunci tidak cocok dengan yang ada di Apps Script.';
  if(c==='kunci_belum_diganti')return 'Kunci di Apps Script masih bawaan. Ganti nilai KUNCI di kode, simpan, lalu terbitkan versi baru.';
  if(c==='respon')return 'Alamat ini tidak menjawab seperti Web app Keuangan Keluarga. Pastikan aksesnya "Siapa saja" dan alamatnya berakhiran /exec.';
  if(c==='http')return 'Google menolak permintaan (HTTP '+(e.status||'?')+'). Periksa alamat Web app.';
  if(c==='jaringan')return 'Tidak bisa menjangkau Google. Periksa internet Anda.';
  if(c==='sibuk')return 'Spreadsheet sedang sibuk. Akan dicoba lagi.';
  if(c==='kunci_kosong')return 'Isi kunci yang sama dengan KUNCI di Apps Script. Kosongkan hanya jika Web app Anda memakai Masuk dengan Google.';
  if(c==='masuk')return 'Sesi masuk berakhir. Masuk lagi dengan Google.';
  if(c==='email_ditolak')return 'Email '+(e.email||'ini')+' belum terdaftar. Minta pemilik menambahkannya di EMAIL_BOLEH pada Apps Script, lalu terbitkan versi baru.';
  if(c==='token')return 'Google tidak bisa memverifikasi akun ini. Coba masuk lagi.';
  if(c==='tanpa_masuk')return 'Web app ini belum memakai Masuk dengan Google.';
  if(c==='izin_kalender')return 'Izin Google Calendar belum diberikan. Di Apps Script jalankan fungsi siapkan lagi, setujui izinnya, lalu terbitkan versi baru.'+(e.msg?' ('+e.msg+')':'');
  if(c==='kalender_mati')return 'Google Calendar belum dinyalakan.';
  if(c==='aksi')return 'Web app belum mendukung fitur ini. Tempel Code.gs terbaru lalu terbitkan versi baru (lihat README).';
  if(c==='galat')return 'Apps Script mengalami galat'+(e.msg?': '+e.msg:'.');
  return 'Gagal tersambung ('+(c||'tidak diketahui')+').';
}
function onErr(e){
  var c=e&&e.code;S.sync.err=c||'x';S.sync.msg=errText(e);
  if(c==='kunci'||c==='kunci_belum_diganti'){if(!S.authBad)toast(S.sync.msg);S.authBad=true;}
  if(c==='masuk'&&S.cfg){ // sesi habis atau dicabut: kembali ke layar masuk, antrean tetap aman
    S.cfg=Object.assign({},S.cfg,{m:'masuk'});delete S.cfg.s;delete S.cfg.k;ls.set('kk_cfg',S.cfg);S.gateErr=S.cfg.c?'Sesi masuk berakhir. Masuk lagi dengan Google.':'';S.sync.err='';
  }
}
function okDoc(c,d){
  if(!d||!d.id)return false;
  if(c==='transaksi')return typeof d.tanggal==='string'&&d.tanggal.length===10&&isFinite(d.jumlah);
  if(c==='kategori')return !!d.nama&&!!d.jenis;
  if(c==='agenda')return !!d.judul&&typeof d.tanggal==='string'&&d.tanggal.length===10;
  return !!d.nama;
}
function toMap(c,a){var m=new Map();(Array.isArray(a)?a:[]).forEach(function(d){if(okDoc(c,d))m.set(d.id,d);});return m;}
function applyOp(it){
  if(it.c==='meta'){if(it.op==='set')S.meta=Object.assign({},S.meta,it.data||{});return;}
  var mp=S[COLS[it.c]];if(!mp)return;
  if(it.op==='delete')mp.delete(it.id);else mp.set(it.id,Object.assign({id:it.id},it.data));
}
function applyPull(r){
  ALL.forEach(function(c){S[COLS[c]]=toMap(c,r[c]);});
  S.meta=r.meta||{};S.rev=r.rev;S.srvVer=r.versi||1;if(r.gcal)S.gcal=r.gcal;
  if(typeof r.sheetUrl==='string'&&/^https:\/\/docs\.google\.com\//.test(r.sheetUrl))S.sheetUrl=r.sheetUrl;
  S.loaded=loadedAll();
  if(S.kat.size){Q=Q.filter(function(x){return !x.seed;});saveQ();}
  maybeSeed();
  saveCache();paint();setTimeout(askMe,50);
}
function maybeSeed(){
  var m=Object.assign({},S.meta);
  Q.forEach(function(it){if(it.c==='meta'&&it.op==='set')Object.assign(m,it.data||{});});
  if(m.seeded||S.kat.size||Q.some(function(x){return x.c==='kategori';}))return;
  DEFAULT_KAT.forEach(function(k){var d=Object.assign({},k);delete d.id;Q.push({c:'kategori',id:k.id,op:'set',data:d,seed:true});});
  Q.push({c:'meta',id:'app',op:'set',data:{seeded:true},seed:true});
  saveQ();flush();
}

var inflight=[],pulling=false,pullAgain=false;
function busy(){return pulling||inflight.length>0;}
function write(c,id,op,data,seed){
  if(NEWC[c]&&bkNeedUpdate()){toast('Perbarui Code.gs di Apps Script dulu agar fitur ini tersimpan di spreadsheet.');return;}
  Q=Q.filter(function(x){return c==='meta'||inflight.indexOf(x)>=0||!(x.c===c&&x.id===id);});
  Q.push({c:c,id:id,op:op,data:data||null,seed:seed||undefined});
  saveQ();paint();flush();
}
function flush(){
  if(inflight.length||!canSync()||!Q.length||navigator.onLine===false)return;
  var batch=Q.slice(0,40);inflight=batch;
  apiCall(S.cfg,'dorong',{ops:batch.map(function(x){return {c:x.c,id:x.id,op:x.op,data:x.data};})}).then(function(r){
    Q=Q.filter(function(x){return batch.indexOf(x)<0;});saveQ();
    batch.forEach(function(it){applyOp(it);});
    inflight=[];S.sync.err='';S.sync.at=Date.now();S.srvVer=r.versi||1;if(r.gcal)S.gcal=r.gcal;
    if(r.skipped&&r.skipped.length)toast(r.skipped.length+' perubahan ditolak oleh spreadsheet.');
    saveCache();paint();
    if(Q.length)flush();else pull(true);
  },function(e){inflight=[];onErr(e);paint();});
}
function pull(force){
  if(!canSync()||navigator.onLine===false)return Promise.resolve();
  if(pulling){pullAgain=true;return Promise.resolve();}
  pulling=true;paint();
  return apiCall(S.cfg,'tarik',{rev:force?0:S.rev}).then(function(r){
    pulling=false;S.sync.err='';S.sync.at=Date.now();
    if(r.same){if(r.gcal)S.gcal=r.gcal;paint();}else applyPull(r);
    if(pullAgain){pullAgain=false;pull(true);}
  },function(e){
    pulling=false;pullAgain=false;onErr(e);
    if(!S.loaded.transaksi){S.loaded=loadedAll();setTimeout(askMe,50);}
    paint();
  });
}
function connect(cfg,done){
  apiCall(cfg,'tarik',{}).then(function(r){
    S.cfg={u:cfg.u,k:cfg.k};ls.set('kk_cfg',S.cfg);S.authBad=false;S.sync={err:'',msg:'',at:Date.now()};
    applyPull(r);flush();done(null);
  },function(e){done(e);});
}
/* Tanya Web app dulu: memakai Masuk dengan Google atau kunci? Web app lama (tanpa "info") dianggap memakai kunci. */
function connectNew(u,k,done){
  apiCall({u:u,k:k||''},'info').then(function(i){
    if(i&&i.masuk){
      var keep=S.cfg&&S.cfg.u===u&&S.cfg.m==='masuk'&&S.cfg.c===(i.clientId||'')?S.cfg:null;
      S.cfg={u:u,m:'masuk',c:i.clientId||''};
      if(keep){S.cfg.s=keep.s;S.cfg.e=keep.e;S.cfg.n=keep.n;}
      ls.set('kk_cfg',S.cfg);S.authBad=false;S.srvVer=i.versi||3;S.sync={err:'',msg:'',at:0};S.gateErr='';S.infoFail=false;
      paint();if(S.cfg.s){flush();pull(true);}
      return done(null);
    }
    if(!k||k.length<8)return done({code:'kunci_kosong'});
    connect({u:u,k:k},done);
  },function(e){
    var c=e&&e.code;
    if(c==='aksi'||c==='kunci'||c==='kunci_belum_diganti'){
      if(!k||k.length<8)return done({code:'kunci_kosong'});
      return connect({u:u,k:k},done);
    }
    done(e);
  });
}

  else if(Q.length){cls='wait';txt=(S.sync.err?'Menunggu kirim · ':'Mengirim · ')+Q.length;}
  else if(S.sync.err){cls='wait';txt='Gagal tersambung';}

  return {cls:cls,txt:txt,detail:S.cfg&&S.sync.err?S.sync.msg:''};
}

/* Perhitungan waktu salat di perangkat (tanpa internet). Dasar: posisi matahari (algoritma PrayTimes), sudut Kemenag RI: Subuh 20°, Isya 18°. */
var SALAT = (function(){
  var R=Math.PI/180;
  function sin(d){return Math.sin(d*R);} function cos(d){return Math.cos(d*R);} function tan(d){return Math.tan(d*R);}
  function asin(x){return Math.asin(x)/R;} function acos(x){return Math.acos(x)/R;} function atan2(y,x){return Math.atan2(y,x)/R;} function acot(x){return Math.atan(1/x)/R;}
  function fix(a,b){a=a-b*Math.floor(a/b);return a<0?a+b:a;}
  function julian(y,m,d){if(m<=2){y-=1;m+=12;}var A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5;}
  function sunPos(jd){
    var D=jd-2451545.0,g=fix(357.529+0.98560028*D,360),q=fix(280.459+0.98564736*D,360);
    var L=fix(q+1.915*sin(g)+0.020*sin(2*g),360),e=23.439-0.00000036*D;
    var RA=fix(atan2(cos(e)*sin(L),cos(L))/15,24);
    return {decl:asin(sin(e)*sin(L)),eqt:q/15-RA<-12?q/15-RA+24:(q/15-RA>12?q/15-RA-24:q/15-RA)};
  }
  /* kembalikan jam desimal (waktu setempat) tiap waktu pada tanggal y-m-d (m 1..12) */
  function hitung(y,m,d,lat,lng,tz,o){
    o=o||{};var fajr=o.fajr==null?20:o.fajr,isha=o.isha==null?18:o.isha;
    var jd=julian(y,m,d)-lng/(15*24);
    function mid(t){return fix(12-sunPos(jd+t).eqt,24);}
    function ang(a,t,ccw){var dc=sunPos(jd+t).decl;var v=(-sin(a)-sin(dc)*sin(lat))/(cos(dc)*cos(lat));if(v<-1||v>1)return NaN;var h=acos(v)/15;return mid(t)+(ccw?-h:h);}
    function asr(f,t){var dc=sunPos(jd+t).decl;return ang(-acot(f+tan(Math.abs(lat-dc))),t,false);}
    var T={subuh:5,terbit:6,dzuhur:12,ashar:13,maghrib:18,isya:18};
    for(var it=0;it<2;it++){
      T={subuh:ang(fajr,T.subuh/24,true),terbit:ang(0.833,T.terbit/24,true),dzuhur:mid(T.dzuhur/24),ashar:asr(1,T.ashar/24),maghrib:ang(0.833,T.maghrib/24,false),isya:ang(isha,T.isya/24,false)};
    }
    var off=tz-lng/15,out={};
    Object.keys(T).forEach(function(k){out[k]=T[k]+off;});
    return out;
  }
  return {hitung:hitung,julian:julian};
})();

/* ---------- Laporan: grafik per pos ---------- */
/* baris laporan satu bulan (k = 'YYYY-MM') untuk satu jenis: Pengeluaran, Pemasukan, atau Tabungan */
function lapRows(tab,k){
  var m={},cnt={};
  D.live.forEach(function(t){
    if(t.jenis!==tab||t.tanggal.slice(0,7)!==k)return;
    var key=tab==='Tabungan'?(t.pos||''):t.kategori;if(!key)return;
    m[key]=(m[key]||0)+t.jumlah;cnt[key]=(cnt[key]||0)+1;
  });
  var rows=Object.keys(m).map(function(key){
    if(tab==='Tabungan'){var p=D.pos.get(key);return {key:key,nama:p?p.nama:'Pos dihapus',v:m[key],n:cnt[key],ikon:(p&&p.ikon)||'coins',warna:(p&&p.warna)||'amber',pos:p||null,ang:0};}
    var c=D.katList.find(function(x){return x.nama===key&&x.jenis===tab;});
    return {key:key,nama:key,v:m[key],n:cnt[key],ikon:(c&&c.ikon)||'dots',warna:(c&&c.warna)||'gray',kat:c||null,ang:(c&&c.anggaran>0)?c.anggaran:0};
  });
  rows.sort(function(a,b){return b.v-a.v||a.nama.localeCompare(b.nama);});
  return rows;
}
/* satu warna berbeda untuk tiap pos dalam grafik: pakai warna miliknya, kalau sudah terpakai ambil warna lain yang masih bebas */
function lapColorMap(tab,keys){
  var tot={},meta={};
  keys.forEach(function(k){lapRows(tab,k).forEach(function(r){tot[r.key]=(tot[r.key]||0)+Math.abs(r.v);meta[r.key]=r;});});
  var order=Object.keys(tot).sort(function(a,b){return tot[b]-tot[a];}),used={},map={};
  order.forEach(function(key){
    var c=meta[key].warna;if(!WARNA[c])c='gray';
    if(used[c]){c=null;for(var i=0;i<WARNA_URUT.length;i++){if(!used[WARNA_URUT[i]]){c=WARNA_URUT[i];break;}}}
    if(!c)c='gray';used[c]=1;map[key]=c;
  });
  return map;
}
function lapDonut(rows,cmap,total,label,aria){
  var C=2*Math.PI*46,start=0,segs='',top=rows.slice(0,7),restV=0;
  rows.slice(7).forEach(function(r){restV+=r.v;});
  var parts=top.map(function(r){return {v:r.v,c:cmap[r.key]||'gray'};});if(restV>0)parts.push({v:restV,c:'gray'});
  var gap=parts.length>1?1.8:0;
  parts.forEach(function(p){
    var len=p.v/total*C,vis=Math.max(len-gap,.6);
    segs+='<circle class="c-'+p.c+'" cx="60" cy="60" r="46" fill="none" style="stroke:var(--f)" stroke-width="20" stroke-dasharray="'+vis.toFixed(2)+' '+(C-vis).toFixed(2)+'" stroke-dashoffset="'+(-start).toFixed(2)+'" transform="rotate(-90 60 60)"/>';
    start+=len;
  });
  var rt=rp(total),fs=rt.length<=10?17:rt.length<=12?15:rt.length<=14?13:11;
  return '<div class="rdn" role="img" aria-label="'+esc(aria)+'"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="46" fill="none" stroke="var(--track)" stroke-width="20"/>'+segs+'</svg><div class="c"><div class="l">'+esc(label)+'</div><div class="v num" style="font-size:'+fs+'px">'+rt+'</div></div></div>';
}
function lapPct(v,total){var x=total>0?v/total*100:0;return x>0&&x<1?'<1%':Math.round(x)+'%';}
function lapRow(r,cmap,total,tab){
  var c=cmap[r.key]||'gray',share=total>0&&r.v>0?r.v/total*100:0;
  var left=r.n+' catatan';
  var right='';
  if(tab==='Pengeluaran'&&r.ang>0){var p=Math.round(r.v/r.ang*100);right='<span style="'+(p>100?'color:var(--bad-ink);font-weight:800':'')+'">'+p+'% dari anggaran '+rp(r.ang)+'</span>';}
  else if(tab==='Tabungan'){var sd=r.pos?(D.saldo[r.pos.id]||0):0;right='Saldo '+rp(sd);}
  else right=lapPct(r.v,total)+' dari total';
  return '<button type="button" class="rrow c-'+c+'" data-act="lap-pos" data-t="'+tab+'" data-v="'+esc(r.key)+'"><div class="tile s">'+ico(r.ikon,28)+'</div><div class="grow"><div class="nm"><span>'+esc(r.nama)+'</span><b class="num">'+(tab==='Tabungan'&&r.v>0?'+':'')+rp(r.v)+'</b></div>'
    +'<div class="bar"><i style="width:'+Math.min(100,share).toFixed(1)+'%"></i></div><div class="sub num"><span>'+esc(left)+'</span><span>'+right+'</span></div></div></button>';
}
function lapTrend(tab,ms,cmap){
  var data=ms.map(function(x){return lapRows(tab,x.k).filter(function(r){return r.v>0;});});
  var tot={};data.forEach(function(rs){rs.forEach(function(r){tot[r.key]=(tot[r.key]||0)+r.v;});});
  var keys=Object.keys(tot).sort(function(a,b){return tot[b]-tot[a];}),top=keys.slice(0,5);
  if(!keys.length)return '<div class="empty">Belum ada data '+tab.toLowerCase()+' dalam 6 bulan terakhir.</div>';
  var mx=0;data.forEach(function(rs){var s=0;rs.forEach(function(r){s+=r.v;});mx=Math.max(mx,s);});var MAX=niceMax(mx);
  var h='<div class="chartwrap">';
  [1,2,3,4].forEach(function(i){var v=MAX*i/4,b=i*25;h+='<div class="grid-l" style="bottom:'+b+'px"></div><div class="grid-t" style="bottom:'+(b-6)+'px">'+fmtJt(v)+'</div>';});
  h+='<div class="bars">'+data.map(function(rs){
    var by={},other=0;rs.forEach(function(r){if(top.indexOf(r.key)>=0)by[r.key]=r.v;else other+=r.v;});
    var seg=top.filter(function(k){return by[k];}).map(function(k){return '<i class="c-'+(cmap[k]||'gray')+'" style="height:'+Math.max(2,Math.round(by[k]/MAX*100))+'px"></i>';}).join('');
    if(other>0)seg+='<i class="c-gray" style="height:'+Math.max(2,Math.round(other/MAX*100))+'px"></i>';
    return '<div class="g"><div class="sc">'+seg+'</div></div>';
  }).join('')+'</div></div>';
  h+='<div class="mlabels">'+ms.map(function(x,i){return '<span class="'+(i===ms.length-1?'now':'')+'">'+BLN[x.m]+'</span>';}).join('')+'</div>';
  h+='<div class="legend2">'+top.map(function(k){var r=null;for(var i=data.length-1;i>=0&&!r;i--)r=data[i].find(function(x){return x.key===k;});return '<span class="c-'+(cmap[k]||'gray')+'"><i class="dot"></i>'+esc(r?r.nama:k)+'</span>';}).join('')+(keys.length>5?'<span class="c-gray"><i class="dot"></i>Lainnya</span>':'')+'</div>';
  return h;
}

function vTotal(){

  var W=314,Hh=84;

  var lastP=pts[5];var area=line+' L'+lastP.x+' '+Hh+' L'+pts[0].x+' '+Hh+' Z';

  var tg=0,tc=0;D.posList.forEach(function(p){if(p.target>0){tg+=p.target;tc+=Math.min(D.saldo[p.id]||0,p.target);}});

  h+='<div class="peek">'+maskot('awan',64,'c-sky')+'<section class="hero" aria-labelledby="tt"><div id="tt" class="sm b muted">Total tabungan, '+D.posList.length+' pos</div><div class="big-num num">'+rp(D.total)+'</div>'
    +'<div style="display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;font-weight:700;color:var(--ink2)">'+ico('trend',18,2.2)+esc(dtxt)+'</div>'
    +'<svg role="img" aria-label="Grafik total tabungan '+BLN[ms[0].m]+' sampai '+BLN[ms[5].m]+': dari '+rp(vals[0])+' menjadi '+rp(vals[5])+'" viewBox="0 0 '+W+' '+Hh+'" style="display:block;width:100%;height:auto;margin-top:12px"><path d="'+area+'" fill="var(--brand-tint)"/><path d="'+line+'" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M'+lastP.x+' '+lastP.y+' h0" fill="none" stroke="var(--blue2)" stroke-width="16" stroke-linecap="round"/><path d="'+dotsP+'" fill="none" stroke="var(--brand)" stroke-width="7" stroke-linecap="round"/></svg>'

  var pg=pct(tc,tg);
  h+='<section class="card" aria-labelledby="pt"><div class="hd"><div id="pt" class="b">Progres semua target</div><div class="bb">'+(tg?pg+'%':'–')+'</div></div><div class="bar" style="margin-top:8px"><i style="width:'+pg+'%;--f:var(--save)"></i></div><div class="sm muted num" style="margin-top:8px">'+(tg?rp(tc)+' dari '+rp(tg)+' di '+nT+' pos bertarget.':'Belum ada pos dengan target.')+'</div></section>';
  var sorted=D.posList.slice().sort(function(a,b){return (D.saldo[b.id]||0)-(D.saldo[a.id]||0);});

  if(D.total>0){
    h+='<div class="stack-bar" role="img" aria-label="Diagram komposisi tabungan per pos" style="margin-top:12px">'+sorted.filter(function(p){return (D.saldo[p.id]||0)>0;}).map(function(p){return '<i class="c-'+esc(p.warna||'blue')+'" style="flex:'+(D.saldo[p.id]/D.total*100)+' 1 0"></i>';}).join('')+'</div>';
    h+='<div style="margin-top:6px">'+sorted.map(function(p){var v=D.saldo[p.id]||0;return '<div class="legrow c-'+esc(p.warna||'blue')+'"><span class="dot"></span><span class="b" style="flex:1;min-width:0;font-size:13px;overflow-wrap:anywhere">'+esc(p.nama)+'</span><span class="sm muted num" style="flex:none">'+rp(v)+'</span><span class="bb num" style="flex:none;width:48px;text-align:right;font-size:13px">'+(Math.round(v/D.total*1000)/10).toString().replace('.',',')+'%</span></div>';}).join('')+'</div>';

function bulanLagi(ym){if(!/^\d{4}-\d{2}$/.test(ym||''))return null;return (+ym.slice(0,4))*12+(+ym.slice(5,7))-(NOW.getFullYear()*12+NOW.getMonth()+1);}
function umCalc(u){
  var total=(Number(u.jamaah)||0)*(Number(u.biaya)||0)+(Number(u.tambahan)||0);
  var p=u.pos&&D.pos.get(u.pos),saldo=p?(D.saldo[p.id]||0):0,sisa=Math.max(0,total-saldo),bln=bulanLagi(u.berangkat);
  return {total:total,saldo:saldo,sisa:sisa,bln:bln,perBln:bln>0?Math.ceil(sisa/bln):sisa,pos:p||null};
}

    +'<div class="bar" style="margin-top:14px"><i style="width:'+pc+'%"></i></div><div class="hd sm b" style="margin-top:8px"><span class="num">'+rp(c.saldo)+' terkumpul</span><span>'+pc+'%</span></div></section></div>';

    +(c.bln!==null?'<div class="kv"><span>Waktu tersisa</span><b>'+(c.bln>0?c.bln+' bulan':'Bulan ini atau lewat')+'</b></div>':'')

    +'</section>';

  else h+='<div class="note warn">'+ico('info',18)+'<div>Pos tabungan untuk rencana ini tidak ditemukan. Ketuk Ubah untuk menghubungkan lagi.</div></div>';

/* ---------- navigasi ---------- */
var VIEWS={beranda:vBeranda,transaksi:vTransaksi,laporan:vLaporan,menu:vMenu,pos:vPos,total:vTotal,kategori:vKategori,kalender:vKalender,groceries:vGroceries,zakat:vZakat,umroh:vUmroh};
var TABS=[['beranda','Beranda','home','terra'],['transaksi','Keuangan','wallet','blue'],['kalender','Kalender','cal','sky'],['menu','Lainnya','grid','green']];
var ACTIVE={beranda:'beranda',transaksi:'transaksi',laporan:'transaksi',pos:'transaksi',total:'transaksi',kategori:'transaksi',kalender:'kalender',menu:'menu'};
var MODR={groceries:1,zakat:1,umroh:1};
function setRoute(r){
  if(MODR[r]){if(!MODR[S.route])S.backTo=S.route;}
  else if(ACTIVE[r])S.tab=ACTIVE[r];
  S.route=r;
}
function renderTabs(){
  var cur=ACTIVE[S.route]||S.tab;
  $('#tabs').innerHTML=TABS.map(function(t){
    return '<a class="tab c-'+t[3]+'" href="#'+t[0]+'" data-act="nav" data-to="'+t[0]+'"'+(cur===t[0]?' aria-current="page"':'')+'>'+ico(t[2],28)+t[1]+'</a>';
  }).join('')+'<button type="button" class="fab" data-act="catat" aria-label="Catat transaksi">'+ico('plus',26,2.2)+'</button>';
}
var raf=0;
function paint(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;render();});}
function render(){
  derive();
  var locked=bkLocked();document.body.classList.toggle('gate',locked);
  if(locked){$('#view').innerHTML=bkGate();$('#tabs').innerHTML='';return;}
  var v=$('#view'),keep=null,ae=document.activeElement;
  if(ae&&ae.id==='bel-nama')keep={v:ae.value,s:ae.selectionStart,e:ae.selectionEnd};
  var empty=remote()&&!S.loaded.transaksi&&!S.tx.size&&!S.kat.size&&!Q.length;
  v.innerHTML=empty?head('Memuat…')+'<div class="empty">Mengambil catatan keluarga.</div>':(VIEWS[S.route]||vBeranda)();
  renderTabs();
  if(keep||S.focusBel){var i=$('#bel-nama');if(i){if(keep){i.value=keep.v;}i.focus();if(keep){try{i.setSelectionRange(keep.s,keep.e);}catch(e){}}}S.focusBel=false;}
}
function go(r,noHash){
  if(!VIEWS[r])r='beranda';
  setRoute(r);

}

/* geser urutan satu kategori ke atas (-1) atau ke bawah (1) di dalam jenisnya */
function katGeser(id,dir){
  derive();var c=D.kat.get(id);if(!c)return;
  var grp=D.katList.filter(function(x){return x.jenis===c.jenis;});
  var i=grp.findIndex(function(x){return x.id===id;}),j=i+dir;if(i<0||j<0||j>=grp.length)return;
  var arr=grp.slice();arr.splice(i,1);arr.splice(j,0,c);
  var vals=grp.map(function(x){return x.urut||0;}).sort(function(a,b){return a-b;});
  for(var q=1;q<vals.length;q++)if(vals[q]<=vals[q-1])vals[q]=vals[q-1]+1;
  arr.forEach(function(x,n){if((x.urut||0)!==vals[n]){var d=Object.assign({},x);delete d.id;d.urut=vals[n];write('kategori',x.id,'set',d);}});
}

  close:function(){closeSheet();},
  bln:function(el){var d=+el.dataset.d;S.m+=d;if(S.m<0){S.m=11;S.y--;}if(S.m>11){S.m=0;S.y++;}paint();},
  mata:function(){S.hide=!S.hide;ls.set('kk_hide',S.hide);paint();toast(S.hide?'Nominal disembunyikan':'Nominal ditampilkan');},
  segar:function(){bkRefresh();},
  'sync-info':function(){var s=syncInfo();toast(s.txt+(s.detail?'. '+s.detail:''));},
  anggota:function(){openAnggota();},
  filter:function(el){S.filter=el.dataset.v;paint();},
  'kat-tab':function(el){S.katTab=el.dataset.v;paint();},
  catat:function(){openCatat();},
  'edit-tx':function(el){var t=D.tx.get(el.dataset.id);if(!t)return;openCatat({id:t.id,jenis:t.jenis,kategori:t.kategori,pos:t.pos||'',mode:t.jumlah<0?'tarik':'setor',jumlah:String(Math.abs(t.jumlah)),tanggal:t.tanggal,oleh:t.oleh||names()[0],ket:t.ket||''});},
  jenis:function(el){readF();F.jenis=el.dataset.v;F.kategori='';F.pos='';refreshCatat();},
  'pick-kat':function(el){readF();F.kategori=el.dataset.v;refreshCatat();},
  'pick-pos':function(el){readF();F.pos=el.dataset.v;refreshCatat();},
  mode:function(el){readF();F.mode=el.dataset.v;refreshCatat();},
  oleh:function(el){readF();F.oleh=el.dataset.v;refreshCatat();},
  'del-tx':function(){
    if(S.confirm!=='tx'){S.confirm='tx';refreshCatat();return;}
    var t=D.tx.get(F.id);if(t){write('transaksi',t.id,'set',Object.assign({},t,{hapus:true,upd:Date.now()}));}
    closeSheet();toast('Catatan dihapus');
  },
  'kat-baru':function(){openKat({jenis:S.katTab,warna:WARNA_URUT[D.katList.length%WARNA_URUT.length]});},
  'kat-baru-dari-catat':function(){readF();openKat({jenis:F.jenis,back:Object.assign({},F)});},
  'kat-edit':function(el){var c=D.kat.get(el.dataset.id);if(!c)return;openKat({id:c.id,nama:c.nama,jenis:c.jenis,anggaran:c.anggaran?String(c.anggaran):'',ikon:c.ikon||'dots',warna:c.warna||'gray'});},
  'k-jenis':function(el){readK();K.jenis=el.dataset.v;refreshKat();},
  'k-ikon':function(el){readK();K.ikon=el.dataset.v;refreshKat();},
  'k-warna':function(el){readK();K.warna=el.dataset.v;refreshKat();},
  'kat-batal':function(){var b=K&&K.back;closeSheet();if(b)openCatat(b);},
  'del-kat':function(){
    var old=D.kat.get(K.id);if(!old){closeSheet();return;}
    var used=D.live.filter(function(t){return t.jenis===old.jenis&&t.kategori===old.nama;});
    if(used.length){
      readK();
      var dest=D.katList.find(function(c){return c.jenis===old.jenis&&c.id!==old.id&&c.nama===K.pindah;});
      if(!dest){S.confirm='';sheetErr('Pilih kategori tujuan untuk memindahkan '+used.length+' catatan.');return;}
      if(S.confirm!=='kat'){S.confirm='kat';refreshKat();return;}
      var now=Date.now();
      used.forEach(function(t){write('transaksi',t.id,'set',Object.assign({},D.tx.get(t.id),{kategori:dest.nama,upd:now}));});
      write('kategori',K.id,'delete');closeSheet();toast(used.length+' catatan dipindah ke '+dest.nama+'. Kategori dihapus.');return;
    }
    if(S.confirm!=='kat'){S.confirm='kat';refreshKat();return;}
    write('kategori',K.id,'delete');closeSheet();toast('Kategori dihapus');
  },
  'kat-urut':function(){S.katSort=!S.katSort;paint();},
  'kat-naik':function(el){katGeser(el.dataset.id,-1);},
  'kat-turun':function(el){katGeser(el.dataset.id,1);},
  'lap-tab':function(el){S.lapTab=el.dataset.v;paint();},
  'lap-pos':function(el){openLapPos(el.dataset.t,el.dataset.v);},
  'pos-baru':function(){openPos();},
  'pos-baru-dari-catat':function(){readF();openPos({back:Object.assign({},F)});},
  'pos-detail':function(el){openPosDetail(el.dataset.id);},
  'pos-ubah':function(el){var p=D.pos.get(el.dataset.id);if(!p)return;openPos({id:p.id,nama:p.nama,target:p.target?String(p.target):'',tenggat:p.tenggat||'',rutin:p.rutin?String(p.rutin):'',saldoAwal:p.saldoAwal?String(p.saldoAwal):'',ikon:p.ikon||'coins',warna:p.warna||'blue'});},
  'pos-setor':function(el){openCatat({jenis:'Tabungan',pos:el.dataset.id,mode:'setor'});},
  'pos-tarik':function(el){openCatat({jenis:'Tabungan',pos:el.dataset.id,mode:'tarik'});},
  'p-ikon':function(el){readP();P.ikon=el.dataset.v;refreshPos();},
  'p-warna':function(el){readP();P.warna=el.dataset.v;refreshPos();},
  'pos-batal':function(){var b=P&&P.back;closeSheet();if(b)openCatat(b);},
  'del-pos':function(){
    var used=D.live.some(function(t){return t.jenis==='Tabungan'&&t.pos===P.id;});
    if(used){sheetErr('Pos ini masih punya riwayat setoran. Hapus dulu catatannya di Transaksi.');return;}
    if(S.confirm!=='pos'){S.confirm='pos';refreshPos();return;}
    write('pos',P.id,'delete');closeSheet();toast('Pos dihapus');
  },
  me:function(el){S.me=el.dataset.v;ls.set('kk_me',S.me);closeSheet();paint();toast('Perangkat ini dipakai oleh '+S.me);},
  'pilih-me':function(el){S.me=el.dataset.v;ls.set('kk_me',S.me);closeSheet();paint();},
  nama:function(){openNama();},
  'clear-contoh':function(){
    if(S.confirm!=='contoh'){S.confirm='contoh';paint();return;}
    S.confirm='';
    Array.from(D.tx.values()).forEach(function(t){if(t.contoh)write('transaksi',t.id,'delete');});
    D.posList.forEach(function(p){if(p.contoh)write('pos',p.id,'delete');});
    toast('Data contoh dihapus');
  },
  csv:function(){
    var rows=D.live.slice().sort(function(a,b){return a.tanggal.localeCompare(b.tanggal)||(a.ts||0)-(b.ts||0);});
    var q=function(s){s=String(s==null?'':s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
    bkCsv('﻿Tanggal,Jenis,Kategori,Keterangan,Jumlah,Oleh\n'+rows.map(function(t){return [t.tanggal,t.jenis,t.kategori,t.ket,t.jumlah,t.oleh].map(q).join(',');}).join('\n'));
  },
  /* kalender */
  'cal-bln':function(el){
    S.cm+=+el.dataset.d;if(S.cm<0){S.cm=11;S.cy--;}if(S.cm>11){S.cm=0;S.cy++;}
    var t=iso(NOW);S.csel=t.slice(0,7)===mk(S.cy,S.cm)?t:mk(S.cy,S.cm)+'-01';paint();
  },
  'cal-pilih':function(el){S.csel=el.dataset.d;S.cy=+S.csel.slice(0,4);S.cm=+S.csel.slice(5,7)-1;paint();},
  'ag-baru':function(el){openAg({tanggal:el.dataset.d||S.csel||iso(NOW)});},
  'ag-edit':function(el){var a=D.ag.get(el.dataset.id);if(!a)return;openAg({id:a.id,judul:a.judul,tanggal:a.tanggal,jam:a.jam||'',jenis:a.jenis||'Acara',ulang:a.ulang||'',jumlah:a.jumlah?String(a.jumlah):'',catatan:a.catatan||'',ingat:a.ingat==null?'':String(a.ingat),src:a.src||''});},
  'a-jenis':function(el){readA();var was=A.jenis==='Tagihan'?'900':'';A.jenis=el.dataset.v;if(HAS_GCAL&&!A.id&&A.ingat===was)A.ingat=A.jenis==='Tagihan'?'900':'';$('#sheet .pb').innerHTML=agBody();},
  'a-ulang':function(el){readA();A.ulang=el.dataset.v;refreshAg();},
  'del-ag':function(){
    if(S.confirm!=='ag'){S.confirm='ag';refreshAg();return;}
    write('agenda',A.id,'delete');closeSheet();toast('Agenda dihapus');
  },
  'ag-catat':function(el){
    var a=D.ag.get(el.dataset.id);if(!a)return;
    openCatat({jenis:'Pengeluaran',kategori:'',jumlah:a.jumlah?String(a.jumlah):'',tanggal:el.dataset.d||a.tanggal,ket:a.judul});
  },
  /* groceries */
  'bel-tog':function(el){var i=D.bel.get(el.dataset.id);if(!i)return;var d=Object.assign({},i);delete d.id;d.selesai=!i.selesai;d.upd=Date.now();write('belanja',i.id,'set',d);},
  'bel-edit':function(el){var i=D.bel.get(el.dataset.id);if(!i)return;openBel({id:i.id,nama:i.nama,qty:i.qty||'',harga:i.harga?String(i.harga):''});},
  'del-bel':function(){
    if(S.confirm!=='bel'){S.confirm='bel';$('#sheet .pb').innerHTML=(readG(),belBody());return;}
    write('belanja',G.id,'delete');closeSheet();toast('Barang dihapus');
  },
  'bel-bersih':function(){
    if(S.confirm!=='belbersih'){S.confirm='belbersih';paint();return;}
    S.confirm='';D.belList.forEach(function(i){if(i.selesai)write('belanja',i.id,'delete');});toast('Daftar dibersihkan');
  },
  'bel-catat':function(){
    var done=D.belList.filter(function(i){return i.selesai;}),sum=0;done.forEach(function(i){sum+=i.harga||0;});
    var kat=D.katList.some(function(c){return c.jenis==='Pengeluaran'&&c.nama==='Makan & Dapur';})?'Makan & Dapur':'';
    openCatat({jenis:'Pengeluaran',kategori:kat,jumlah:sum>0?String(sum):'',ket:('Belanja: '+done.map(function(i){return i.nama;}).join(', ')).slice(0,120)});
  },
  /* zakat */
  'zk-set':function(){openZkSet();},
  'zk-maal':function(){openZkMaal();},
  'zk-catat':function(el){openCatat({jenis:'Pengeluaran',kategori:zakatKat(),jumlah:el.dataset.v,ket:el.dataset.ket||'Zakat'});},
  /* umroh */
  'um-edit':function(){openUm();},
  'um-pos':function(el){readU();U.pos=el.dataset.v;refreshUm();},
  'del-um':function(){
    if(S.confirm!=='um'){S.confirm='um';refreshUm();return;}
    write('umroh','umroh','delete');closeSheet();toast('Rencana umroh dihapus');
  },
  'um-cek':function(el){
    var u=D.umroh;if(!u)return;
    var cur=(u.cek||'').split(',').filter(Boolean),v=el.dataset.v,ix=cur.indexOf(v);if(ix>=0)cur.splice(ix,1);else cur.push(v);
    var d=Object.assign({},u);delete d.id;d.cek=cur.join(',');d.upd=Date.now();write('umroh','umroh','set',d);
  },
  'um-setor':function(){var u=D.umroh;if(!u)return;var c=umCalc(u);openCatat({jenis:'Tabungan',pos:u.pos,mode:'setor',jumlah:c.sisa>0&&c.perBln>0?String(c.perBln):''});}
});
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='close'&&el.classList.contains('scrim')&&e.target!==el)return;
  var fn=H[el.dataset.act];if(fn)fn(el,e);
});
document.addEventListener('input',function(e){
  var t=e.target;if(!t)return;
  if(t.matches&&t.matches('[data-money]')){var d=digits(t.value).replace(/^0+(?=\d)/,'');t.value=d?dots(d):'';}
  if(P&&(t.id==='p-target'||t.id==='p-rutin'||t.id==='p-saldo')){readP();var hh=$('#p-hint');if(hh)hh.innerHTML=posHint();}
  if(U&&(t.id==='u-jam'||t.id==='u-biaya'||t.id==='u-tamb'||t.id==='u-ber')){readU();var uh=$('#um-hint');if(uh)uh.innerHTML=umHint();}
  if(t.id&&t.id.indexOf('zm-')===0){var f=$('#sheet form[data-form="zkmaal"]'),zr=$('#zm-res');if(f&&zr)zr.innerHTML=zmRes(zmCalc(f));}
  if(t.id==='kota-q'){var l=$('#kota-list');if(l)l.innerHTML=kotaList(t.value);}
});


/* ---------- mulai ---------- */
(function initRoute(){var r=(location.hash||'').slice(1);if(VIEWS[r]){S.route=r;if(ACTIVE[r])S.tab=ACTIVE[r];}})();
render();
function askMe(){
  if(S.me||S.asked||bkLocked()||!S.loaded.transaksi||!$('#sheet').hidden)return;
  S.asked=true;
  var n=names();
  setTimeout(function(){if(!$('#sheet').hidden&&/Siapa yang memakai/.test($('#sheet').textContent))S.askShown=true;},0);
  showSheet('Siapa yang memakai perangkat ini?','<div class="sm muted">Dipakai sebagai nilai awal kolom "Oleh" saat mencatat. Bisa diubah kapan saja di Lainnya.</div><div class="btns">'+n.map(function(x){return '<button type="button" class="btn" data-act="pilih-me" data-v="'+esc(x)+'">'+esc(x)+'</button>';}).join('')+'</div>');
}
function catatShortcut(){
  if(location.hash!=='#catat')return;
  try{history.replaceState(null,'',location.pathname+location.search+'#beranda');}catch(e){}
  var tries=0;(function w(){if(S.loaded.transaksi||tries++>25)openCatat();else setTimeout(w,200);})();
}
bkBoot();

})();
</script>
</body>
</html>
